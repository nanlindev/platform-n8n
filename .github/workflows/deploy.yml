name: Deploy Platform n8n

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Backup + image pull can exceed default; keep generous timeout.
          command_timeout: 40m
          script: |
            set -euo pipefail

            PROJECT_DIR="/home/deploy/projects/platform-n8n"
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "First deployment: cloning repository..."
              git clone https://github.com/nanlindev/platform-n8n.git "$PROJECT_DIR"
            fi
            cd "$PROJECT_DIR"
            git fetch origin main
            git reset --hard origin/main

            if [ ! -f .env ]; then
              echo "ERROR: $PROJECT_DIR/.env missing — copy from .env.example"
              exit 1
            fi

            chmod +x scripts/ensure-networks.sh scripts/backup_n8n_pre_deploy.sh

            # U8+: backup Postgres + n8n_data BEFORE image pull/up (while old tag still running)
            if [ "${SKIP_PRE_DEPLOY_BACKUP:-}" = "1" ]; then
              echo "SKIP_PRE_DEPLOY_BACKUP=1 — skipping backup"
            else
              bash scripts/backup_n8n_pre_deploy.sh
            fi

            ./scripts/ensure-networks.sh
            docker compose -f docker/compose.yml --env-file .env pull
            docker compose -f docker/compose.yml --env-file .env up -d

            running="$(docker compose -f docker/compose.yml --env-file .env ps --status running -q n8n_app | wc -l)"
            if [ "$running" -lt 1 ]; then
              echo "ERROR: n8n_app is not running"
              docker compose -f docker/compose.yml --env-file .env logs --tail=50 n8n_app || true
              exit 1
            fi

            # Post-upgrade sanity (no Public API key required).
            # Parse N8N_PORT without sourcing .env (values may break bash).
            PORT="$(awk -F= '/^N8N_PORT=/{print $2; exit}' .env | tr -d \"'\" || true)"
            PORT="${PORT:-5678}"
            # 2.28 → 2.46 may run many DB migrations; allow up to ~10 minutes.
            echo "Waiting for /healthz on :$PORT (up to 10m) ..."
            ok=0
            i=0
            while [ "$i" -lt 120 ]; do
              i=$((i + 1))
              if curl -sf --max-time 5 "http://127.0.0.1:${PORT}/healthz" >/tmp/n8n_healthz.json; then
                ok=1
                echo "healthz OK after attempt $i"
                break
              fi
              if [ $((i % 6)) -eq 0 ]; then
                echo "still waiting for healthz (attempt $i) ..."
                docker compose -f docker/compose.yml --env-file .env ps n8n_app || true
              fi
              sleep 5
            done
            if [ "$ok" != "1" ]; then
              echo "ERROR: /healthz not OK after migrations wait"
              docker compose -f docker/compose.yml --env-file .env logs --tail=120 n8n_app || true
              exit 1
            fi
            cat /tmp/n8n_healthz.json || true
            VER="$(docker compose -f docker/compose.yml --env-file .env exec -T n8n_app n8n --version | tr -d '\r')"
            echo "n8n --version: $VER"
            echo "$VER" | grep -q '2\.46\.4' || {
              echo "ERROR: expected n8n 2.46.4, got: $VER"
              docker compose -f docker/compose.yml --env-file .env logs --tail=80 n8n_app || true
              exit 1
            }

            docker image prune -f
            echo "PASS remote deploy + healthz + version 2.46.4"
